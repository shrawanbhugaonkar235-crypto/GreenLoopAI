services:
  - type: web
    name: greenloopai
    env: python
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: MONGODB_DATABASE
        value: greenloopai
      - key: YOLO_MODEL_PATH
        value: models/yolov8n.pt
      - key: TESSERACT_CMD
        value: tesseract
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
